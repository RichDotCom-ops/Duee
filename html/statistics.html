<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>duee. — Statistics</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
<div class="app-layout">

  <aside class="sidebar">
    <div class="sidebar-logo"><a href="dashboard.html">duee<span>.</span></a></div>
    <nav class="sidebar-nav">
      <a class="nav-item" data-page="dashboard" href="dashboard.html"><i data-feather="grid"></i> Dashboard</a>
      <a class="nav-item" data-page="classes" href="classes.html"><i data-feather="book-open"></i> Classes</a>
      <a class="nav-item" data-page="calendar" href="calendar.html"><i data-feather="calendar"></i> Calendar</a>
      <a class="nav-item" data-page="assignments" href="assignments.html"><i data-feather="clipboard"></i> Assignments</a>
      <a class="nav-item" data-page="reminders" href="reminders.html"><i data-feather="bell"></i> Reminders</a>
      <a class="nav-item" data-page="statistics" href="statistics.html"><i data-feather="bar-chart-2"></i> Statistics</a>
    </nav>
    <div class="sidebar-bottom">
      <a class="nav-item" data-page="settings" href="settings.html"><i data-feather="settings"></i> Settings</a>
      <a class="nav-item" href="#" onclick="event.preventDefault();signOutUser()"><i data-feather="log-out"></i> Log out</a>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <div class="topbar-left"><h1>Statistics</h1></div>
      <div class="topbar-right">
        <button class="topbar-icon-btn"><i data-feather="bell"></i></button>
        <div class="avatar" id="user-avatar" onclick="location.href='settings.html'">H</div>
      </div>
    </header>

    <main class="page-content">
      <div class="page-header">
        <h2>Your Progress</h2>
      </div>

      <!-- Top stats -->
      <div class="stats-row" id="stats-row" style="margin-bottom:24px;"></div>

      <div class="stats-full-grid">
        <!-- Completion Rate -->
        <div class="stats-full-card" style="display:flex;flex-direction:column;align-items:center;text-align:center;">
          <h3 style="align-self:flex-start;">Completion Rate</h3>
          <div class="circle-wrap">
            <svg class="circle-svg" width="140" height="140" viewBox="0 0 140 140">
              <circle class="circle-track" cx="70" cy="70" r="57"/>
              <circle class="circle-fill" id="circle-fill" cx="70" cy="70" r="57"/>
            </svg>
            <div class="circle-label">
              <div class="circle-pct" id="circle-pct">0%</div>
              <div class="circle-sub">completed</div>
            </div>
          </div>
          <div id="completion-detail" style="font-size:14px;color:var(--text-secondary);"></div>
        </div>

        <!-- By Class -->
        <div class="stats-full-card">
          <h3>Assignments by Class</h3>
          <div id="by-class"></div>
        </div>

        <!-- Priority Breakdown -->
        <div class="stats-full-card">
          <h3>Priority Breakdown</h3>
          <div id="priority-breakdown"></div>
        </div>

        <!-- Recent Activity -->
        <div class="stats-full-card">
          <h3>Recent Completions</h3>
          <div id="recent-completions"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/feather-icons/dist/feather.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/plan.js"></script>
<script src="../js/ai.js?v=4"></script>
<script src="../js/notifications.js"></script>
<script>
let _classes = [], _assignments = [];

document.addEventListener('DOMContentLoaded', async () => {
  const session = await Auth.requireAuth();
  if (!session) return;
  window._currentUser = session.user;
  [_classes, _assignments] = await Promise.all([DB.getClasses(), DB.getAssignments()]);
  loadStats();
});

function classById(id) { return _classes.find(c => c.id === id) || null; }

function loadStats() {
  const total = _assignments.length;
  const completed = _assignments.filter(a => a.completed).length;
  const pending = total - completed;
  const pct = total ? Math.round((completed / total) * 100) : 0;

  document.getElementById('stats-row').innerHTML = `
    <div class="stat-card"><div class="stat-icon green"><i data-feather="check-circle"></i></div><div class="stat-info"><div class="stat-num">${completed}</div><div class="stat-label">Completed</div></div></div>
    <div class="stat-card"><div class="stat-icon blue"><i data-feather="clock"></i></div><div class="stat-info"><div class="stat-num">${pending}</div><div class="stat-label">Pending</div></div></div>
    <div class="stat-card"><div class="stat-icon yellow"><i data-feather="layers"></i></div><div class="stat-info"><div class="stat-num">${total}</div><div class="stat-label">Total</div></div></div>
    <div class="stat-card"><div class="stat-icon red"><i data-feather="book-open"></i></div><div class="stat-info"><div class="stat-num">${_classes.length}</div><div class="stat-label">Classes</div></div></div>
  `;
  feather.replace({ width:18, height:18 });

  document.getElementById('circle-pct').textContent = pct + '%';
  document.getElementById('completion-detail').textContent = `${completed} of ${total} assignments completed`;
  const circumference = 2 * Math.PI * 57;
  const fill = document.getElementById('circle-fill');
  fill.style.strokeDasharray = circumference;
  fill.style.strokeDashoffset = circumference;
  setTimeout(() => {
    fill.style.strokeDashoffset = circumference - (pct / 100) * circumference;
  }, 100);

  const byClass = document.getElementById('by-class');
  if (!_classes.length) { byClass.innerHTML = '<p style="color:var(--text-secondary)">No classes yet.</p>'; }
  else {
    byClass.innerHTML = _classes.map(c => {
      const classAll = _assignments.filter(a => a.classId === c.id);
      const classDone = classAll.filter(a => a.completed).length;
      const classPct = classAll.length ? Math.round((classDone / classAll.length) * 100) : 0;
      return `<div class="progress-bar-wrap">
        <div class="progress-bar-label">
          <span style="display:flex;align-items:center;gap:6px;"><span style="width:9px;height:9px;border-radius:50%;background:${c.color};display:inline-block;"></span>${c.name}</span>
          <span>${classDone}/${classAll.length}</span>
        </div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill" style="width:0%;background:${c.color};transition:width 0.8s ease;" data-width="${classPct}"></div>
        </div>
      </div>`;
    }).join('');
  }

  const priorities = [
    { label: 'High Priority', items: _assignments.filter(a => a.priority === 'high'), color: 'var(--red)' },
    { label: 'Medium Priority', items: _assignments.filter(a => a.priority === 'medium'), color: 'var(--yellow)' },
    { label: 'Low Priority', items: _assignments.filter(a => a.priority === 'low'), color: 'var(--green)' },
  ];
  document.getElementById('priority-breakdown').innerHTML = priorities.map(p => {
    const done = p.items.filter(a => a.completed).length;
    const ppct = p.items.length ? Math.round((done / p.items.length) * 100) : 0;
    return `<div class="progress-bar-wrap">
      <div class="progress-bar-label">
        <span>${p.label}</span><span>${done}/${p.items.length}</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" style="width:0%;background:${p.color};" data-width="${ppct}"></div>
      </div>
    </div>`;
  }).join('');

  const recent = _assignments.filter(a => a.completed)
    .sort((a, b) => b.dueDate.localeCompare(a.dueDate))
    .slice(0, 6);
  const rcEl = document.getElementById('recent-completions');
  if (!recent.length) {
    rcEl.innerHTML = `<div style="color:var(--text-secondary);font-size:14px;">Complete some assignments to see them here!</div>`;
  } else {
    rcEl.innerHTML = recent.map(a => {
      const cls = classById(a.classId);
      const color = cls ? cls.color : '#9ca3af';
      return `<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);">
        <div style="width:26px;height:26px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${a.name}</div>
          <div style="font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:4px;">
            <span style="width:7px;height:7px;border-radius:50%;background:${color};display:inline-block;"></span>
            ${cls ? cls.name : 'No class'}
          </div>
        </div>
        <div style="font-size:12px;color:var(--text-muted);">${fmtDate(a.dueDate)}</div>
      </div>`;
    }).join('');
  }

  setTimeout(() => {
    document.querySelectorAll('.progress-bar-fill').forEach(el => {
      el.style.width = (el.dataset.width || 0) + '%';
    });
    feather.replace({ width:16, height:16 });
  }, 100);
}
</script>
</body>
</html>
