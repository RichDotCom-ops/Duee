<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="#16a34a"/>

  <!-- Subtle inner glow -->
  <rect width="512" height="512" rx="120" fill="url(#glow)" opacity="0.4"/>

  <defs>
    <radialGradient id="glow" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>
  </defs>

  <!-- "d" letter -->
  <text
    x="82"
    y="370"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="320"
    font-weight="700"
    fill="white"
  >d</text>

  <!-- Period dot -->
  <circle cx="428" cy="358" r="44" fill="white"/>
</svg>
